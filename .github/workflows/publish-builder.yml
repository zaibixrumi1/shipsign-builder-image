name: Build ShipSign APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zaibixrumi1/shipsign-builder:latest
    steps:
      - uses: actions/checkout@v6

      - name: Build Debug APK
        run: |
          PROJECT_DIR=$(dirname "$(find . -maxdepth 3 -name "settings.gradle*" | head -n 1)")
          cd "$PROJECT_DIR"
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --build-cache --parallel --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC"
          else
            gradle assembleDebug --build-cache --parallel --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ShipSign-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
